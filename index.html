<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Tracker</title>
</head>
<body>
  <h1>Track your video</h1>

  <input id="codeInput" type="text" placeholder="Enter your code, e.g. VID-7K2Q9X">
  <button id="trackButton">Track</button>

  <div id="result"></div>

  <script>
    const input = document.getElementById("codeInput");
    const button = document.getElementById("trackButton");
    const resultBox = document.getElementById("result");

    const API_URL = "https://script.google.com/macros/s/AKfycbywNrxXLThUA8bKL6MC_iERXYBH_TIGyEdoQjj8WMmWNzGk0OMwzMqqrHD4FiHNO5_3Yw/exec";
    button.addEventListener("click", async function () {
    const code = input.value.toUpperCase().trim();
    resultBox.textContent = "Loading...";

    const response = await fetch(API_URL + "?code=" + code);
    const data = await response.json();
    if(!data.found){
        resultBox.textContent = "Code not found. Please check and try again.";
    } else {
  resultBox.textContent = "";

  const title = document.createElement("h2");
  title.textContent = data.name + " — " + data.project;
  resultBox.appendChild(title);

  const shootBox = document.createElement("div");
    shootBox.textContent = "Shoot: " + data.shoot_status;
    if(data.shoot_date){shootBox.textContent +=" ("+data.shoot_date+")";}
  resultBox.appendChild(shootBox);


  const deliveryBox = document.createElement("div");
  if(data.delivery_date){deliveryBox.textContent = "Delivery Date: " + data.delivery_date;}
  else{deliveryBox.textContent = "Delivery: not scheduled yet.";}
  resultBox.appendChild(deliveryBox);

if(data.delivery_note){
  const deliveryNote = document.createElement("div");
  deliveryNote.textContent = "Delivery note: " + data.delivery_note;
  resultBox.appendChild(deliveryNote);
}
  }


});
  </script>
</body>
</html>
